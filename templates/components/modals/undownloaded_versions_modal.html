<!-- Undownloaded Versions Modal: every remote version that is not in the local library -->
<div id="undownloadedVersionsModal" class="modal">
    <div class="modal-content undownloaded-versions-modal">
        <div class="modal-header">
            <button class="close" onclick="modalManager.closeModal('undownloadedVersionsModal')">&times;</button>
            <h2>{{ t('modals.undownloadedVersions.title', default='Undownloaded Versions') }}</h2>
        </div>

        <div class="undownloaded-versions-toolbar">
            <label class="undownloaded-versions-select-all">
                <input type="checkbox" id="undownloadedVersionsSelectAll">
                <span>{{ t('modals.undownloadedVersions.selectAll', default='Select all') }}</span>
            </label>
            <span class="undownloaded-versions-summary" id="undownloadedVersionsSummary"></span>
        </div>

        <div class="undownloaded-versions-list" id="undownloadedVersionsList">
            <div class="undownloaded-versions-loading" id="undownloadedVersionsLoading">
                {{ t('common.status.loading') }}
            </div>
        </div>

        <div class="modal-actions undownloaded-versions-actions">
            <button class="secondary-btn" id="undownloadedVersionsIgnoreBtn" disabled>
                <i class="fas fa-ban"></i>
                <span id="undownloadedVersionsIgnoreBtnText">{{ t('modals.undownloadedVersions.ignoreSelected', default='Ignore selected') }}</span>
            </button>
            <button class="primary-btn" id="undownloadedVersionsDownloadBtn" disabled>
                <i class="fas fa-download"></i>
                <span id="undownloadedVersionsDownloadBtnText">{{ t('modals.undownloadedVersions.downloadSelected', default='Download selected') }}</span>
            </button>
        </div>
    </div>
</div>
